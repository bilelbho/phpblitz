[package]
name = "phpblitz"
version = "0.2.1"
description = "A fast, open source PHP IDE"
authors = ["The PHPBlitz Authors"]
license = "Apache-2.0"
repository = "https://github.com/bilelbho/phpblitz"
edition = "2021"

[lib]
name = "phpblitz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Builds the PHP built-in definitions (functions, classes, extensions) at compile time.
mago-prelude = { version = "=1.57.0", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mago: PHP linter, static analyzer and formatter, linked in as libraries.
mago-orchestrator = "=1.57.0"
mago-linter = { version = "=1.57.0", features = ["serde"] }
mago-text-edit = "=1.57.0"
# Reading (toml) and editing without losing comments (toml_edit) the project's mago.toml.
toml = "0.8"
toml_edit = "0.22"
# File watching (changes made outside PHPBlitz: git, composer, other editors).
notify = "8.2"
# Find in Files: ripgrep's directory walker (respects .gitignore) and regex engine.
ignore = "0.4"
regex = "1"
# Delete moves files to the Recycle Bin / Trash instead of erasing them.
trash = "5"
# Mago analyses in its own, smaller thread pool (see mago.rs), so the UI keeps CPU.
rayon = "1"
# Interactive terminal: pseudo-terminals (ConPTY on Windows) and binary-safe output events.
portable-pty = "0.9"
base64 = "0.22"
mago-analyzer = "=1.57.0"
mago-database = "=1.57.0"
mago-reporting = "=1.57.0"
mago-php-version = "=1.57.0"
mago-prelude = { version = "=1.57.0", features = ["serde"] }
# The symbol index (index.rs): parser, name resolution and scanner.
mago-syntax = "=1.57.0"
mago-names = "=1.57.0"
mago-codex = "=1.57.0"
mago-allocator = "=1.57.0"
mago-word = "=1.57.0"
mago-span = "=1.57.0"
# Checking open files against the project's declarations while the full analysis runs.
mago-semantics = "=1.57.0"
# The symbol index cache (.blitz/cache/index.bin).
bincode = "1.3"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = { version = "25", default-features = false, features = ["minimal-rust", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# The AI assistant's calls to Anthropic (ai.rs): the same HTTP client and TLS as the updater.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The MCP server's token (mcp.rs).
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
spellbook = "0.4.2"

# Linux: the Secret Service (GNOME Keyring, KWallet) over D-Bus; without it keyring keeps
# passwords in memory only.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

# Programs installed while PHPBlitz runs: the PATH saved in the registry (process.rs); reading the
# clipboard without the web view's permission prompt (clipboard.rs).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

# Auto-update from GitHub Releases, and the restart after installing one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Dependencies (Mago, Tauri) stay optimized in debug builds, so `tauri dev` analysis is fast.
[profile.dev.package."*"]
opt-level = 2

# Release builds: optimized as one unit (smaller, a little faster), symbols stripped. Panics still
# unwind, so a panic in a background task (Mago on an odd file) stays an error instead of a crash.
[profile.release]
lto = true
codegen-units = 1
strip = true
