# Builds the documentation site in docs/ and publishes it to GitHub Pages.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/keymap/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  # The install page lists the latest release's files. A release that a workflow publishes with
  # GITHUB_TOKEN doesn't start other workflows, so the end of "Publish release" does it too.
  release:
    types: [published]
  workflow_run:
    workflows: [Publish release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run docs:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
