# Windows build: type-check, Rust tests, then the installers (NSIS .exe and .msi).
# Pushing a tag like v0.2.0 also attaches the installers to that GitHub release (as a draft).

name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # beforeBuildCommand (npm run build) builds the front end first.
      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: phpblitz-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
