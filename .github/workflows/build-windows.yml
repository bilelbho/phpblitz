# Windows build: type-check, Rust tests, then the installers (NSIS .exe and .msi) and a portable
# .zip (the app without installing; it needs the WebView2 runtime, included in Windows 11 and
# updated Windows 10).
# Pushing a tag like v0.2.0 also attaches them to that GitHub release (as a draft; release.yml
# publishes it once every build has succeeded).

name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # beforeBuildCommand (npm run build) builds the front end first.
      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      # The portable version: the app and its license files in a zip, nothing to install.
      - name: Make the portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'No app .exe in src-tauri/target/release' }
          $dir = "PHPBlitz-$version"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe.FullName "$dir/PHPBlitz.exe"
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $dir
          New-Item -ItemType Directory -Force portable | Out-Null
          Compress-Archive -Path $dir -DestinationPath "portable/PHPBlitz_${version}_windows-x64-portable.zip"
          Get-ChildItem portable

      - uses: actions/upload-artifact@v4
        with:
          name: phpblitz-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.zip
