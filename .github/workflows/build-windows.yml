# Windows build: type-check, Rust tests, then the installers (NSIS .exe and .msi) and a portable
# .zip (the app without installing; it needs the WebView2 runtime, included in Windows 11 and
# updated Windows 10).
# Pushing a tag like v0.2.0 also attaches them to that GitHub release (as a draft; release.yml
# publishes it once every build has succeeded), with the .sig files the updater checks.
#
# Code signing through SignPath runs once the repository variable SIGNPATH_ORGANIZATION_ID and the
# secret SIGNPATH_API_TOKEN exist (see .signpath/README.md); until then the files are unsigned.

name: Build (Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Front-end tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # beforeBuildCommand (npm run build) builds the front end first.
      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      # The portable version: the app and its license files in a zip, nothing to install.
      - name: Make the portable zip
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'No app .exe in src-tauri/target/release' }
          $dir = "PHPBlitz-$version"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe.FullName "$dir/PHPBlitz.exe"
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md $dir
          New-Item -ItemType Directory -Force portable | Out-Null
          Compress-Archive -Path $dir -DestinationPath "portable/PHPBlitz_${version}_windows-x64-portable.zip"
          Get-ChildItem portable

      # SignPath signs the installers and the portable zip's exe, then hands them back.
      - name: Collect the files to sign
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          mkdir -p to-sign
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi portable/*.zip to-sign/

      - id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: phpblitz-windows-unsigned
          path: to-sign/*
          if-no-files-found: error

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: phpblitz
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed files
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          cp signed/*-setup.exe src-tauri/target/release/bundle/nsis/
          cp signed/*.msi src-tauri/target/release/bundle/msi/
          cp signed/*.zip portable/

      # After code signing: the updater's signature covers the final files.
      - name: Sign the update files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo 'No TAURI_SIGNING_PRIVATE_KEY secret: update files not signed.'; exit 0; fi
          version=${GITHUB_REF_NAME#v}
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/msi/*.msi; do
            npx tauri signer sign --app-version "$version" "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: phpblitz-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            portable/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            portable/*.zip
