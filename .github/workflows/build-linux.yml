# Linux build: type-check, lint, tests and clippy, then the packages (.deb, .rpm and .AppImage).
# Pushing a tag like v0.2.0 also attaches the packages to that GitHub release (as a draft;
# release.yml publishes it once every build has succeeded).
# Built on Ubuntu 22.04 so the packages run on older glibc versions too.

name: Build (Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # The runner's disk is small: the debug build for the tests plus the release build (with LTO)
      # filled it in 0.1.6. Remove preinstalled toolchains PHPBlitz doesn't use (about 20 GB).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      # WebKitGTK and friends for Tauri; OpenSSL for the database drivers' TLS;
      # D-Bus for storing passwords in the Secret Service (GNOME Keyring, KWallet).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libxdo-dev pkg-config patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Front-end tests
        run: npm test

      # Without debug info the test build is a fraction of the size; it's removed before the
      # release build, which compiles everything again anyway.
      - name: Rust tests and clippy
        working-directory: src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          rm -rf target/debug
          df -h /

      # beforeBuildCommand (npm run build) builds the front end first.
      - name: Build packages
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Sign the update files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo 'No TAURI_SIGNING_PRIVATE_KEY secret: update files not signed.'; exit 0; fi
          version=${GITHUB_REF_NAME#v}
          for f in src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm; do
            npx tauri signer sign --app-version "$version" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: phpblitz-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
